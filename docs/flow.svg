<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">How ABD works</title>
  <desc id="d">Three steps: load a booth photo or floor plan, place AV gear from the Item Bank, then render with AI. Steps one and two stay on your device; only the render request is sent to Google Gemini.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06122A"/><stop offset="1" stop-color="#0D2A5C"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7FE3FF" stroke-opacity=".06"/></pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8F1FA" stroke-opacity=".6" stroke-width="1.6" stroke-linecap="round"/></marker>
    <clipPath id="r"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)"><rect width="1200" height="400" fill="url(#bg)"/><rect width="1200" height="400" fill="url(#grid)"/></g>
  <rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="#7FE3FF" stroke-opacity=".22"/>
  <g font-family="Inter,'Segoe UI',system-ui,-apple-system,Arial,sans-serif" fill="#E8F1FA">
    <text x="600" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#E8F1FA">Load. Place. Render.</text>

    <!-- card 1 -->
    <rect x="50" y="86" width="320" height="220" rx="18" fill="#7FE3FF" fill-opacity=".07" stroke="#7FE3FF" stroke-opacity=".4"/>
    <g transform="translate(160 112)" fill="none" stroke="#7FE3FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="6" width="100" height="62" rx="8"/><circle cx="26" cy="28" r="7"/><path d="M6 62L38 38l22 18 14-10 22 20"/>
    </g>
    <text x="210" y="226" text-anchor="middle" font-size="40" font-weight="800" fill="#7FE3FF">1</text>
    <text x="210" y="256" text-anchor="middle" font-size="20" font-weight="700">Load</text>
    <text x="210" y="282" text-anchor="middle" font-size="14" fill-opacity=".7">Floor plan, booth photo, or blank</text>

    <!-- card 2 -->
    <rect x="440" y="86" width="320" height="220" rx="18" fill="#FFB45A" fill-opacity=".07" stroke="#FFB45A" stroke-opacity=".4"/>
    <g transform="translate(550 112)" fill="none" stroke="#FFB45A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="4" width="44" height="30" rx="4"/><rect x="56" y="4" width="44" height="30" rx="4"/><rect x="0" y="46" width="44" height="30" rx="4"/><path d="M78 46v30M63 61h30"/>
    </g>
    <text x="600" y="226" text-anchor="middle" font-size="40" font-weight="800" fill="#FFB45A">2</text>
    <text x="600" y="256" text-anchor="middle" font-size="20" font-weight="700">Place</text>
    <text x="600" y="282" text-anchor="middle" font-size="14" fill-opacity=".7">Drag or tap gear; BOM tallies itself</text>

    <!-- card 3 -->
    <rect x="830" y="86" width="320" height="220" rx="18" fill="#FF6FDC" fill-opacity=".07" stroke="#FF6FDC" stroke-opacity=".4"/>
    <g transform="translate(940 108)" fill="none" stroke="#FF6FDC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 4l7 20 20 7-20 7-7 20-7-20-20-7 20-7z"/><path d="M88 52l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    </g>
    <text x="990" y="226" text-anchor="middle" font-size="40" font-weight="800" fill="#FF6FDC">3</text>
    <text x="990" y="256" text-anchor="middle" font-size="20" font-weight="700">Render</text>
    <text x="990" y="282" text-anchor="middle" font-size="14" fill-opacity=".7">One click to a photoreal preview</text>

    <!-- arrows -->
    <path d="M378 196H432" stroke="#E8F1FA" stroke-opacity=".5" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <path d="M768 196H822" stroke="#E8F1FA" stroke-opacity=".5" stroke-width="2" fill="none" marker-end="url(#ah)"/>

    <!-- privacy strip -->
    <path d="M50 340H760" stroke="#7FE3FF" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <text x="405" y="368" text-anchor="middle" font-size="14" fill="#7FE3FF">Stays on your device: projects, library, API key</text>
    <path d="M830 340H1150" stroke="#FF6FDC" stroke-opacity=".6" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/>
    <text x="990" y="368" text-anchor="middle" font-size="14" fill="#FF6FDC">Sent to Gemini only when you click Render</text>
  </g>
</svg>
